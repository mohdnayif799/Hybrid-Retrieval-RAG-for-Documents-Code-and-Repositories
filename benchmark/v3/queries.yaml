# Retrieval benchmark v3 - span-level ground truth.
#
# Corpus: unchanged from v2 (psf/requests @ dae7ef63, 95 files, 1111 chunks;
# the PDF, .txt and .docx documents, 111 chunks; 1222 chunks in total).
#
# Fields
#   qtype   exact_identifier | keyword | paraphrase | multi_hop | misspelled |
#           list_all | repo_identity | unanswerable   (stratification + reporting)
#   domain  code (anything from the repository) | docs (uploaded documents)
#   origin  v2 (carried over, wording unchanged) | v3 (new in this set)
#   gold    span-level ground truth - see benchmark/v3/gold.py for the format.
#           Anchors are verbatim text located in the real parent file at load
#           time; `evidence` (the answer itself) must occur inside the span.
#   relevant  v2's file-level locators, kept for the secondary file-level
#           metric on code queries.
#
# Status: reviewed. Frozen by benchmark/v3/manifest.json together with the
# dev/holdout split (benchmark/v3/split.json); edit only via a documented re-freeze.

