# Retrieval benchmark ground truth.
#
# CORPUS
#   repo : psf/requests @ dae7ef63b4df6eded86637f251fc4e3a06c3b479  (95 files, 1111 chunks)
#   docs : Deep_Learning_Unit1_Quick_Notes.pdf  (2 pages,  4 chunks)
#          space_planets_moons_advanced.txt     (1 "page", 8 chunks)
#
# LOCATOR FORMAT
#   repo      -> repository-relative path string, e.g. "src/requests/sessions.py"
#   documents -> {file: <basename>, page: <int>}
#
#   `page` is the RAW CHUNK METADATA VALUE and is 0-INDEXED, so PDF page 1 is
#   page: 0. The UI displays page+1. Ground truth matches the metadata rather
#   than the display so the matcher needs no conversion and cannot drift by one.
#   The .txt has no pages; every chunk carries page: 0.
#
#   Ground truth is at FILE/PAGE level, never chunk level, so it survives a
#   change to chunk size.
#
# SPANS (optional)
#   `span_anchor` names a definition or heading. The harness locates it in the
#   real parent file and derives the character range; no line numbers are typed
#   by hand, so nothing drifts when the pin changes. Annotated only where the
#   answer genuinely occupies one contiguous region — conceptual and cross_file
#   answers do not, and are deliberately left unannotated.
#
# AUTHORING PROTOCOL
#   Every question was written from an information need FIRST, then the answer
#   was located. Repo questions were drawn from knowledge of the requests
#   public API and its documentation, not from reading the chunks they are
#   expected to retrieve. exact_identifier and literal_string deliberately use
#   the literal token, because that is how people actually search.
#   `unanswerable` items were each verified absent from the whole corpus.

