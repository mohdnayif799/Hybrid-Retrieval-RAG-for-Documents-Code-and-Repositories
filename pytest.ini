[pytest]
# Keeps pytest's temp directories inside the project.
#
# On some Windows setups the default base under %TEMP%\pytest-of-<user> ends up
# with an ACL that denies os.scandir, and every test using the tmp_path fixture
# then errors during setup with WinError 5 — before any project code runs.
# Pointing basetemp at a dedicated project-local folder sidesteps it entirely.
#
# WARNING: pytest CLEARS whatever basetemp points at. Only ever aim it at a
# dedicated throwaway directory. Never at "." or a source folder.
addopts = --basetemp=.pytest-tmp
